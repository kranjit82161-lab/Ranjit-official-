<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#030712"/>
  <circle cx="256" cy="256" r="230" stroke="#0e7490" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="200" stroke="#06b6d4" stroke-width="4" fill="none" opacity="0.6"/>
  
  <!-- Outer Segments -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#neon)">
    <line x1="256" y1="36" x2="256" y2="76" />
    <line x1="256" y1="436" x2="256" y2="476" />
    <line x1="36" y1="256" x2="76" y2="256" />
    <line x1="436" y1="256" x2="476" y2="256" />
    <line x1="100" y1="100" x2="130" y2="130" />
    <line x1="412" y1="412" x2="382" y2="382" />
    <line x1="412" y1="100" x2="382" y2="130" />
    <line x1="100" y1="412" x2="130" y2="382" />
  </g>

  <!-- Glowing Core -->
  <circle cx="256" cy="256" r="140" fill="url(#arcGlow)"/>
  <circle cx="256" cy="256" r="130" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="24 12"/>
  <circle cx="256" cy="256" r="90" stroke="#67e8f9" stroke-width="5" fill="#082f49" filter="url(#neon)"/>
  <polygon points="256,190 313,289 199,289" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <circle cx="256" cy="256" r="36" fill="#e0f2fe" filter="url(#neon)"/>
  <text x="256" y="365" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#38bdf8" letter-spacing="8">JARVIS</text>
</svg>
